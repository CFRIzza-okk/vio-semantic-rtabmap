services:
  d435-rtabmap:
    build: .
    image: vio-d435-rtabmap:humble
    container_name: d435-rtabmap
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./data:/root/.ros/rtabmap
    command: ["/usr/local/bin/launch_d435_rtabmap"]
